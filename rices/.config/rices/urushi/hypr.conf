# Urushi — visual layer only.
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(c9a24aff)
    col.inactive_border = rgba(241d17ff)
}
decoration {
    rounding = 2
    active_opacity = 1.0
    inactive_opacity = 0.94
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 12
        render_power = 4
        color = rgba(000000aa)
    }
}
animations {
    enabled = true
    bezier = lacquer, 0.7, 0, 0.2, 1
    animation = windows, 1, 7, lacquer, slide
    animation = fade, 1, 8, lacquer
    animation = workspaces, 1, 8, lacquer, slidevert
}
