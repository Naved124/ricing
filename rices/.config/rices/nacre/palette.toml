
# Nacre — a light desktop, like the inside of a shell.
# Colour only at the edges and in motion, never as flat fills.
#   · no pure white surfaces: everything is frosted glass
#   · no black shadows: every shadow is lilac-tinted
#   · iridescence is reserved for focus and active state
#
# Single source of truth. `rice-render nacre` turns this file into Theme.qml
# and every app theme; never hand-edit the generated files.

[meta]
name          = "nacre"
title         = "Nacre"
tagline       = "pearl glass, colour at the edges"
transition    = "ripple"      # dissolve shader used when switching into Nacre
shell         = "nacre"       # Quickshell config: qs -c nacre
notifications = "shell"       # the shell is the notification daemon (no swaync)
wallpaper     = "shell"       # the shell draws the wallpaper (no mpvpaper/swww)
lock          = "shell"       # the shell is the lock screen (no hyprlock)
# `rice mode`: the pearl turns (orient.frag). An iridescent ring in the
# target mode's gradient grows from the bar's orb (top left, x, y of the
# screen) with the new mode inside it; a glint (colour gleam) runs round it.
mode_transition = "orient"
mode_origin     = [0.013, 0.02]
mode_tint       = "gleam"
mode_tint_alpha = 0.5
mode_ms         = 800

[fonts]
display   = "Italiana"        # clock, lock screen, greetings, big numbers
ui        = "Manrope"
mono      = "IBM Plex Mono"
ui_size   = 14
mono_size = 15.5

# weights everywhere (shell, GTK, Qt, kitty, browsers): body text and
# emphasis, on the CSS scale (400 regular, 600 semibold, 700 bold)
weight         = 600
weight_strong  = 700
display_weight = 400   # Italiana has only one weight

[shape]
window         = 16
rounding_power = 2.0
panel          = 18
popup          = 12
chip           = 8
border         = 2
gaps_in        = 6
gaps_out       = 16

[motion]
# cubic-bezier control points
bloom  = [0.2, 0.9, 0.2, 1.0]
settle = [0.34, 1.3, 0.64, 1.0]
sink   = [0.4, 0.0, 0.6, 1.0]
# milliseconds
open        = 450
close       = 300
move        = 400
workspace   = 500
scratchpad  = 400
focus       = 400
border_loop = 60000  # Hyprland caps animations at 10 s, so the border loops every 10 s
panel_in    = 350
panel_out   = 250
stagger     = 30

# the cursor is the same in both modes; the GTK theme and icons are per mode
[gtk]
cursor       = "Bibata-Modern-Ice"
cursor_size  = 24

[nvim]
colorscheme = "rice"   # build/nvim/rice.lua, linked into ~/.config/nvim/colors

# Generated files that live outside build/ (path relative to $HOME).
[install]
"quickshell/Theme.qml" = ".config/quickshell/nacre/Theme.qml"

# ── light ───────────────────────────────────────────────────────────────────
# What changes with the mode lives under [modes.<mode>.*]. Templates see the
# active mode's tables as colors, roles, ansi, … and its meta merged into
# [meta], exactly as before.

[modes.light.meta]
gtk_theme     = "adw-gtk3"
icon_theme    = "Colloid-Light"
color_scheme  = "prefer-light"
# Hyprland's frost and shadow (hypr-mode.lua)
hypr_blur_brightness = 0.92
hypr_blur_vibrancy   = 0.4
hypr_shadow_range    = 34
hypr_shadow_alpha    = [0.30, 0.18]     # focused, unfocused
hypr_rim_gleam       = ["ee", "cc"]     # the ice edge's bright stops (hex alpha)
hypr_pane            = ["99", "55"]     # unfocused: gleam at the top, lilac below

[modes.light.colors]
pearl    = "#f4f1f6"   # base surfaces
shell    = "#e7e2ec"   # secondary surfaces, inactive chips
lilac    = "#c9bfd8"   # inactive borders, dividers
ink      = "#3b3548"   # main text
ink_soft = "#7a7189"   # labels, secondary text
rose     = "#f2c3d6"   # gradient stop, urgent
sky      = "#c3dff3"   # gradient stop, selection, links
mint     = "#cdeedb"   # gradient stop, success
sun      = "#f3e2b0"   # gradient stop, warning
orchid   = "#dcc6f2"   # gradient stop, cursor
mist     = "#f7f4f9"   # pale panel tint
plum     = "#7d6a9a"   # deep lilac, for the odd accent line
frost    = "#eef2f8"   # terminal glass (used at 58% over the blur)
ink_deep = "#2e2a3d"   # terminal text: darker, so it reads on lighter glass
steel    = "#6e82b4"   # window and panel shadows: cool, never black
glaze    = "#f4f6fb"   # Quickshell glass fill (used at 55%)
rim      = "#a0aad2"   # glass hairline (used at 45%)
gleam    = "#ffffff"   # specular highlights only, never a surface

# Roles name a colour above; templates shared by every rice only use roles.
[modes.light.roles]
bg        = "pearl"
surface   = "shell"
overlay   = "lilac"
border    = "lilac"
fg        = "ink"
muted     = "ink_soft"
accent    = "orchid"
urgent    = "rose"
selection = "sky"
success   = "mint"
warning   = "sun"
cursor    = "orchid"
link      = "sky"
shadow    = "steel"
term_bg   = "frost"
term_fg   = "ink_deep"

[modes.light.gradient]
# rose → sky → mint → sun → orchid → rose, rotating conically
stops = ["rose", "sky", "mint", "sun", "orchid"]
angle = 45

[modes.light.ansi]
# normal colours hold at least 4.5:1 (checked at 4.6) against the terminal
# glass: #eef2f8 at 58% over the blurred wallpaper, wherever the window sits
color0  = "#3b3548"
color1  = "#91284f"
color2  = "#355744"
color3  = "#644d21"
color4  = "#2f546f"
color5  = "#674277"
color6  = "#2f5757"
color7  = "#534e5b"
color8  = "#7a7189"
color9  = "#e891b0"
color10 = "#86bf9c"
color11 = "#dcbb73"
color12 = "#8bb7d8"
color13 = "#bf97d0"
color14 = "#7cc2c0"
color15 = "#f4f1f6"

[modes.light.opacity]
terminal = 0.72    # kitty: frosted, but solid enough to read at a glance
active   = 0.97    # glassy windows (terminals, files, music, tools)
inactive = 0.90
glass    = 0.55    # Quickshell panel fill over Hyprland blur

# The live wallpaper (shaders/wallpaper.frag): a cold steel-to-lilac ground,
# vivid blooms (the gradient stops at 70% saturation) and deeper ice/orchid
# accents, so the blur has real shapes to smear.
[modes.light.wallpaper]
ground  = ["#c9d3e6", "#d8cde6"]
blooms  = ["#ed97ba", "#8ec4eb", "#8eebb6", "#ead086", "#c49bed"]
accents = ["#9fb8e0", "#c7a8e0", "#9fb8e0"]

# ── dark: Black Pearl ───────────────────────────────────────────────────────
# A Tahitian black pearl: a dark body with peacock, sapphire, aubergine and
# rose in its orient. Same names as light; the gradient stops keep their
# order (rose, sky, mint, sun, orchid → rose, sapphire, peacock, champagne,
# aubergine), so every gradient maps one to one. The orient stops are for
# rings, borders and washes; text uses paler *_ink colours, less saturated
# than the day's pastels (tests/test_night.py).

[modes.dark.meta]
gtk_theme     = "adw-gtk3-dark"
icon_theme    = "Colloid-Dark"
color_scheme  = "prefer-dark"
# smoked pearl, not grey fog
hypr_blur_brightness = 0.82
hypr_blur_vibrancy   = 0.15
hypr_shadow_range    = 40
hypr_shadow_alpha    = [0.60, 0.35]
hypr_rim_gleam       = ["2e", "1a"]     # the specular stop, at 18% and 10%
hypr_pane            = ["14", "80"]     # rgba(4a445880) below a faint glint

[modes.dark.colors]
pearl    = "#18171e"   # base (the spec's #131219 is L* 5.8, under 7)
shell    = "#211f29"   # surfaces
lilac    = "#4a4458"   # inactive borders
line     = "#34303f"   # dividers, hairlines
ink      = "#e0dce8"   # text (#ebe7f1 is 15:1, over the 14:1 halation limit)
ink_soft = "#a39cb1"
rose     = "#c06b94"   # orient stops
sky      = "#5a86c8"   # sapphire
mint     = "#46a394"   # peacock
sun      = "#bdb39a"   # champagne-silver: yellow turns brown on dark
orchid   = "#9367b8"   # aubergine
mist     = "#1f1d27"   # solid panels
plum     = "#8a78a8"
frost    = "#1a1920"   # terminal glass
ink_deep = "#d6d1df"   # terminal text
steel    = "#1a1521"   # shadows: near black with ~12% aubergine
glaze    = "#1b1a22"   # Quickshell glass fill (at opacity.glass)
rim      = "#4a4458"   # glass hairline
gleam    = "#f4f1f6"   # specular only, at 10–18%
# text versions of the orient, paler than the day's pastels
orchid_ink = "#b3a3cb"
rose_ink   = "#cfa6b6"
sky_ink    = "#a8b8cc"
rose_alert = "#e48aa8" # a wrong password
sapphire_deep = "#2b3a57"   # selection behind text

[modes.dark.roles]
bg        = "pearl"
surface   = "shell"
overlay   = "line"
border    = "line"
fg        = "ink"
muted     = "ink_soft"
accent    = "orchid_ink"
urgent    = "rose_ink"
selection = "sapphire_deep"
success   = "mint"
warning   = "sun"
cursor    = "orchid"
link      = "sky_ink"
shadow    = "steel"
term_bg   = "frost"
term_fg   = "ink_deep"

[modes.dark.gradient]
stops = ["rose", "sky", "mint", "sun", "orchid"]
angle = 45

[modes.dark.ansi]
color0  = "#131219"
color1  = "#e48aa8"
color2  = "#7cc4a2"
color3  = "#d8bd7a"
color4  = "#82a9dc"
color5  = "#b892d6"
color6  = "#6fc0bc"
color7  = "#c9c3d3"
color8  = "#4d4859"
color9  = "#f0a6bf"
color10 = "#99d6b9"
color11 = "#e8d199"
color12 = "#a1c1e8"
color13 = "#cfb0e6"
color14 = "#8fd3cf"
color15 = "#ebe7f1"

[modes.dark.opacity]
terminal = 0.86    # smoked glass
active   = 0.97    # window rules are shared by both modes (hypr.lua)
inactive = 0.90
glass    = 0.74

# The black pearl (shaders/wallpaper.frag with dark = 1): a #15131b → #0f0e14
# ground; the blooms walk through peacock, sapphire, aubergine and rose at
# ~40% saturation and 28–34% lightness; the accents are deep and faint.
[modes.dark.wallpaper]
ground  = ["#15131b", "#0f0e14"]
blooms  = ["#2f6f65", "#304a6f", "#56346f", "#6f3453", "#3a3f6a"]
accents = ["#1d2235", "#2a1f33", "#1d2235"]
