# Nacre — visual layer only. Keybinds, rules and monitors live in the base config.
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(b8a6ffee) rgba(8fd3e0ee) rgba(f2b8c6ee) 45deg
    col.inactive_border = rgba(3a374688)
}
decoration {
    rounding = 18
    active_opacity = 0.97
    inactive_opacity = 0.90
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.25
    }
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }
}
animations {
    enabled = true
    bezier = pearl, 0.2, 0.9, 0.1, 1.05
    animation = windows, 1, 5, pearl, popin 85%
    animation = fade, 1, 6, default
    animation = workspaces, 1, 6, pearl, slidefade 15%
}
