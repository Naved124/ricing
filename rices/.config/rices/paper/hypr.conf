# Paper — visual layer only.
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(2f5d8aff)
    col.inactive_border = rgba(d6ccb6ff)
}
decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 14
        render_power = 2
        offset = 0 4
        color = rgba(2b262033)
    }
}
animations {
    enabled = true
    bezier = page, 0.5, 0, 0.2, 1
    animation = windows, 1, 4, page, slide
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, page, slide
}
