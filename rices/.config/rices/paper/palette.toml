
# Paper — a desk in daylight. Windows are sheets, the terminal is a
# typewriter, notifications are sticky notes, and closing a window crumples
# it into the bin.
#   · light everywhere: no blur, no transparency, no glass
#   · shadows do the separating (no borders), warm brown, never black
#   · ink blue for what's active, the ribbon red for what needs you
#
# Single source of truth. `rice-render paper` turns this file into Theme.qml
# and every app theme; never hand-edit the generated files.

[meta]
name          = "paper"
title         = "Paper"
tagline       = "sheets on a desk, typewriter and pencil"
transition    = "peel"        # the page peeled from the bottom-right corner
shell         = "paper"       # Quickshell config: qs -c paper
notifications = "shell"       # sticky notes from the shell (no swaync)
wallpaper     = "shell"       # the shell shows assets/wall.png (no swww)
lock          = "shell"       # the torn envelope (no hyprlock)
# `rice mode`: the lamp clicks (lamp.frag). Darkness closes in from the edges
# to the lamp's pool, or the pool grows until the room is lit. The lamp sits
# here on every output (x, y of the screen); the dark wallpaper's pool is
# drawn in the same place. Its edge is warm amber at 25%.
mode_transition = "lamp"
mode_origin     = [0.18, 0.12]
mode_tint       = "#ffb35c"
mode_tint_alpha = 0.25
mode_ms         = 900
# the pull-chain click, played when sound = true in ~/.config/rice/mode.toml
mode_sound      = "assets/click.wav"

[fonts]
display   = "Newsreader"      # clocks, the calendar's day, song titles
ui        = "Newsreader"      # GTK, Qt and browser chrome: a book serif reads better than a hand
mono      = "Courier Prime"   # the typewriter
ui_size   = 14
mono_size = 15
# Paper's shell writes in three hands
type      = "Courier Prime"
hand      = "Kalam"           # 300, 400 and 700
serif     = "Newsreader"

# weights on the CSS scale; Courier Prime and Kalam come in 400 and 700
weight         = 400
weight_strong  = 700
display_weight = 600

[shape]
window         = 3      # paper has corners
rounding_power = 2.0
panel          = 3
popup          = 3
chip           = 2
border         = 0      # no borders: shadows only
gaps_in        = 10
gaps_out       = 22

[motion]
# cubic-bezier control points, shared by Hyprland and the shell
bloom  = [0.2, 1.3, 0.4, 1.0]    # "drop": a sheet dropped onto the desk
settle = [0.2, 1.5, 0.4, 1.0]    # "slap": a sticky note pressed down
sink   = [0.5, 0.0, 0.75, 0.4]   # "toss": thrown away
turn   = [0.45, 0.05, 0.25, 1.0] # "turn": a page turned (workspaces)
# milliseconds
open        = 500
close       = 400
move        = 500
workspace   = 700
scratchpad  = 500
focus       = 300
border_loop = 0
panel_in    = 400
panel_out   = 300
stagger     = 30

# the cursor is the same in both modes; the GTK theme and icons are per mode
[gtk]
cursor       = "Bibata-Modern-Classic"
cursor_size  = 24

[nvim]
colorscheme = "rice"   # build/nvim/rice.lua (Paper's own scheme), linked into ~/.config/nvim/colors

# Generated files that live outside build/ (path relative to $HOME).
[install]
"quickshell/Theme.qml" = ".config/quickshell/paper/common/Theme.qml"

# ── light ───────────────────────────────────────────────────────────────────
# What changes with the mode lives under [modes.<mode>.*]. Templates see the
# active mode's tables as colors, roles, ansi, … and its meta merged into
# [meta], exactly as before.

[modes.light.meta]
gtk_theme     = "adw-gtk3"
icon_theme    = "Papirus-Light"
color_scheme  = "prefer-light"
# Hyprland's decoration:screen_shader while this rice is active (relative to
# the rice folder). `rice` clears it when switching to a rice without one,
# and `rice grain off` turns it off without leaving Paper.
screen_shader = "grain.frag"
# Hyprland's shadow under every window (hypr-mode.lua)
hypr_shadow_range  = 18
hypr_shadow_offset = [3, 8]
hypr_shadow_alpha  = "38"            # hex alpha of the focused window's shadow
hypr_shadow_alpha_inactive = "20"

[modes.light.colors]
desk     = "#d9d6cc"   # the desk under everything
wall     = "#ebe8df"   # the drafting sheet on the desk (wallpaper)
paper    = "#f7f5ef"   # windows, the terminal
card     = "#fbfaf6"   # index cards: bar, launcher, panels
kraft    = "#d8b98a"   # manila folders, the envelope's desk
ink      = "#1c2a6e"   # fountain-pen blue: active, accent
pencil   = "#4b4a46"   # body text
graphite = "#8d8a82"   # secondary text, outlines
red      = "#c8372d"   # the typewriter ribbon: alerts, the clock, ticks
rule     = "#a8c3e4"   # ruled lines
margin   = "#e3958f"   # the red margin line
sticky   = "#f6e15f"   # yellow notes, the highlighter
pink     = "#ffb6c8"   # urgent notes, washi tape
mint     = "#b8e5c8"   # quiet notes
carbon   = "#24231f"   # typewriter type
fern     = "#2f6b3d"   # green ink
ochre    = "#946617"   # yellow ochre (darkened from #a8741a to read on paper)
plum     = "#8a3b7a"
teal     = "#2d6f78"
umber    = "#3c2d14"   # shadow colour: warm brown
crease   = "#d9d4c6"   # hairlines and dividers
manila   = "#3a2c14"   # text on kraft
envelope = "#f3ead6"   # the lock screen's envelope
chalk    = "#ffffff"   # bright stock: tear-off pages, photo borders, a note's sheen
soot     = "#000000"   # only ever faint: vignettes, punched holes, the lift under tape
felt     = "#2b2a1e"   # felt-tip on the sticky notes
binding  = "#3b0f0b"   # the tear-off pad's binding holes
wad      = "#f2efe6"   # crumpled balls in the bin
wad_crease = "#a9a59a" # the creases in them
basket   = "#3c3c3a"   # the shade inside the wire bin (used at 8%)
scrim    = "#504632"   # behind the launcher (used at 18%)

# Roles name a colour above; templates shared by every rice only use roles.
[modes.light.roles]
bg        = "paper"
surface   = "card"
overlay   = "desk"
border    = "crease"
fg        = "pencil"
muted     = "graphite"
accent    = "ink"
urgent    = "red"
selection = "sticky"    # a highlighter stroke, with carbon text on it
success   = "fern"
warning   = "ochre"
cursor    = "carbon"
link      = "ink"
shadow    = "umber"
term_bg   = "paper"
term_fg   = "carbon"

[modes.light.gradient]
stops = ["ink", "red", "sticky"]
angle = 0

[modes.light.ansi]
# A typewriter's ribbon on paper. Every normal colour holds at least 4.5:1
# against #f7f5ef (tests/test_render.py checks it): color3 and color7 are
# darkened from the preview's #a8741a and #8d8a82, which read at 3.7 and 3.2.
color0  = "#24231f"
color1  = "#c8372d"
color2  = "#2f6b3d"
color3  = "#946617"
color4  = "#1c2a6e"
color5  = "#8a3b7a"
color6  = "#2d6f78"
color7  = "#716f67"
color8  = "#4b4a46"
color9  = "#e0503f"
color10 = "#3f8a52"
color11 = "#c48e2a"
color12 = "#3348a0"
color13 = "#a65596"
color14 = "#3c8a94"
color15 = "#d9d6cc"

[modes.light.opacity]
terminal = 1.0
active   = 1.0
inactive = 1.0
glass    = 1.0

# The wallpaper is a still image (assets/wall.png); boot screens shade from
# the wall into the desk.
[modes.light.wallpaper]
image   = "assets/wall.png"
ground  = ["wall", "desk"]
texture = "assets/paper-tex.png"   # the paper stock: kitty's background, the shell's sheets

# ── dark: Paper Night, a lamplit desk ───────────────────────────────────────
# The same desk at night under a lamp (top left). Same names as light, so the
# shell and templates follow the light: the ink becomes gel-blue, the ribbon
# coral, the typewriter types cream, and the notes are black card with a
# coloured strip of adhesive. tests/test_night.py keeps it comfortable.

[modes.dark.meta]
gtk_theme     = "adw-gtk3-dark"
icon_theme    = "Papirus-Dark"
color_scheme  = "prefer-dark"
# rendered from templates/grain-dark.frag: fibres that lighten, and the lamp
screen_shader = "build/dark/grain-dark.frag"
# a darker, larger shadow on a dark desk
hypr_shadow_range  = 22
hypr_shadow_offset = [3, 10]
hypr_shadow_alpha  = "aa"
hypr_shadow_alpha_inactive = "66"
# the lamp: where its pool sits (x, y of the screen), and the screen shader's
# vignette (corners at most 5% darker, a warm lift of at most 3% at the lamp;
# 0 turns it off)
lamp_pos      = [0.18, 0.12]
lamp_vignette = 0.04

[modes.dark.colors]
desk     = "#161411"   # walnut-charcoal under everything
wall     = "#1a1815"   # the wallpaper's ground
paper    = "#1f1c19"   # the sheet: windows, the terminal
card     = "#2a2622"   # black index cards: bar, launcher, panels, notes
kraft    = "#3b3024"   # dark manila
kraft_hi = "#4d3e2c"   # a step lighter: yazi's chosen file (dark only; see night())
ink      = "#a3b4f0"   # gel-blue (was the fountain pen's ink)
pencil   = "#c9c1b0"   # body text
graphite = "#8f897c"   # secondary text, outlines
red      = "#ef8a78"   # coral (was the ribbon red): alerts, the clock, ticks
rule     = "#2f3a4c"   # ruled lines, dim blue
margin   = "#6e403a"   # the margin line
sticky   = "#d8c25a"   # yellow adhesive strip, the highlighter
pink     = "#d99aab"   # pink strip, washi tape
mint     = "#93c4a4"   # mint strip
carbon   = "#e6dfcf"   # cream: the typewriter's white ribbon
fern     = "#9cc48a"
ochre    = "#e2c46a"   # a warm straw, not a muddy darkened ochre
plum     = "#d39bd0"
teal     = "#86c4bd"
umber    = "#0b0a08"   # shadow colour: near-black, warm
crease   = "#3a3630"   # hairlines and dividers
manila   = "#e8d9bd"   # text on kraft
envelope = "#2b241d"   # the lock screen's envelope, in lamplight
chalk    = "#34302a"   # tear-off pages, photo borders, a note's sheen
soot     = "#070605"   # faint shade: vignettes, holes, the lift under tape
felt     = "#e6dfcf"   # cream gel pen on the notes
binding  = "#0d0b09"   # the tear-off pad's holes
wad      = "#4a453d"   # crumpled balls in the bin
wad_crease = "#2a2622"
basket   = "#0e0d0b"
scrim    = "#070605"   # behind the launcher

[modes.dark.roles]
bg        = "paper"
surface   = "card"
overlay   = "desk"
border    = "crease"
fg        = "pencil"
muted     = "graphite"
accent    = "ink"
urgent    = "red"
selection = "kraft"     # one step of manila, with gel-blue text
success   = "fern"
warning   = "ochre"
cursor    = "carbon"
link      = "ink"
shadow    = "umber"
term_bg   = "paper"
term_fg   = "carbon"

[modes.dark.gradient]
stops = ["ink", "red", "sticky"]
angle = 0

[modes.dark.ansi]
color0  = "#1c1a17"
color1  = "#ef8a78"
color2  = "#9cc48a"
color3  = "#e2c46a"
color4  = "#a3b4f0"
color5  = "#d39bd0"
color6  = "#86c4bd"
color7  = "#c9c1b0"
color8  = "#5a554c"
color9  = "#f6a596"
color10 = "#b4d6a3"
color11 = "#eed58a"
color12 = "#bcc9f6"
color13 = "#e2b5df"
color14 = "#a2d6cf"
color15 = "#e6dfcf"

[modes.dark.opacity]
terminal = 1.0
active   = 1.0
inactive = 1.0
glass    = 1.0

[modes.dark.wallpaper]
image   = "assets/wall-dark.png"
ground  = ["desk", "wall"]
texture = "assets/sheet-dark.png"
