<!doctype html>
<!-- Generated by rice-render for {{ meta.title }}: a new tab on ruled paper. Set it as
     Firefox's home page:
       file://{{ derived.build_dir }}/firefox/startpage.html
     or, to follow rice and mode switches, the same path through ~/.local/share/rice/active/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<style>
:root {
    --desk: {{ colors.desk }};
    --paper: {{ colors.paper }};
    --card: {{ colors.card }};
    --ink: {{ colors.ink }};
    --pencil: {{ colors.pencil }};
    --graphite: {{ ansi.color7 }};
    --red: {{ colors.red }};
    --rule: {{ colors.rule }};
    --margin: {{ colors.margin }};
    --sticky: {{ colors.sticky }};
    --hand: "{{ fonts.hand }}", "Segoe Print", cursive;
    --serif: "{{ fonts.serif }}", Georgia, serif;
    --type: "{{ fonts.type }}", "Courier New", monospace;
    --line: 32px;
}
* { box-sizing: border-box; }
html, body { min-height: 100vh; margin: 0; }
body {
    background: var(--desk);
    color: var(--pencil);
    font-family: var(--hand);
    display: grid;
    place-items: center;
    padding: 24px 16px;
}
/* the sheet: ruled every 32 px, a red margin, a soft shadow on the desk */
main {
    position: relative;
    width: min(680px, 100%);
    padding: 40px 40px 36px 96px;
    background:
        linear-gradient(90deg, transparent 66px, var(--margin) 66px, var(--margin) 67.5px, transparent 67.5px),
        repeating-linear-gradient(transparent 0 calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px) var(--line)),
        var(--paper);
    background-position: 0 0, 0 18px, 0 0;
    box-shadow: 1px 2px 1px rgba(60, 45, 20, .22), 3px 8px 14px rgba(60, 45, 20, .16);
    transform: rotate(-.6deg);
}
.tape {
    position: absolute;
    top: -10px;
    width: 96px;
    height: 24px;
    background: repeating-linear-gradient(45deg, rgba(255, 182, 200, .75) 0 7px, rgba(255, 255, 255, .6) 7px 14px);
    opacity: .85;
}
.tape.l { left: 26px; transform: rotate(-12deg); }
.tape.r { right: 26px; transform: rotate(11deg); }
h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(38px, 6vw, 56px);
    color: var(--ink);
    margin: 0;
    line-height: 1;
}
.date {
    font-family: var(--type);
    letter-spacing: .3em;
    font-size: 13px;
    color: var(--red);
    text-transform: uppercase;
    margin: 12px 0 28px;
}
form { position: relative; }
input {
    width: 100%;
    height: 44px;
    border: 0;
    border-bottom: 1.5px dashed var(--graphite);
    background: transparent;
    color: var(--ink);
    font: 400 23px var(--hand);
    outline: none;
    padding: 0;
    caret-color: var(--ink);
}
input::placeholder { color: var(--graphite); }
input:focus { border-bottom-color: var(--ink); }
nav { margin-top: 26px; display: grid; gap: 0; }
nav a {
    position: relative;
    line-height: var(--line);
    font-size: 20px;
    color: var(--pencil);
    text-decoration: none;
}
nav a small { font-size: 14px; color: var(--graphite); margin-left: 8px; }
nav a:hover, nav a:focus-visible { color: var(--ink); outline: none; }
nav a:hover::before, nav a:focus-visible::before {
    content: "→";
    position: absolute;
    left: -34px;
    color: var(--red);
}
@media (prefers-reduced-motion: no-preference) {
    main { animation: drop .5s cubic-bezier({{ motion.bloom | join(", ") }}); }
    @keyframes drop { from { transform: translateY(-40px) rotate(-.6deg); opacity: 0; } }
}
</style>
</head>
<body>
<main>
    <span class="tape l"></span><span class="tape r"></span>
    <h1 id="greeting">Hello</h1>
    <div class="date" id="date"></div>
    <form action="https://duckduckgo.com/" method="get" autocomplete="off">
        <input name="q" placeholder="what are you looking for?" autofocus aria-label="Search">
    </form>
    <!-- your places: edit rices/paper/templates/firefox/startpage.html -->
    <nav>
        <a href="https://github.com">GitHub<small>the code</small></a>
        <a href="https://www.youtube.com">YouTube<small>something to watch</small></a>
        <a href="https://mail.google.com">Mail<small>the post</small></a>
        <a href="https://www.reddit.com/r/unixporn">r/unixporn<small>other desks</small></a>
        <a href="https://wiki.hypr.land">Hyprland<small>the manual</small></a>
    </nav>
</main>
<script>
const now = new Date(), h = now.getHours();
document.getElementById("greeting").textContent =
    h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
document.getElementById("date").textContent =
    now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
// a typed address goes straight there
document.querySelector("form").addEventListener("submit", e => {
    const q = e.target.q.value.trim();
    if (/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q)) {
        e.preventDefault();
        location.href = q.includes("://") ? q : "https://" + q;
    }
});
</script>
</body>
</html>
