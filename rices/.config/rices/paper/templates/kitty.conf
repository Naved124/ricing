# Generated by rice-render for {{ meta.title }}: kitty as a typewriter.
# Include it from kitty.conf:
#   include ~/.local/share/rice/active/kitty.conf
# kitty re-reads it on SIGUSR1, which `rice` sends on every switch.
#
# The page is paper stock (a tiled texture, tinted towards the paper colour),
# the type is Courier Prime in carbon, and the cursor is a carriage
# underscore. kitty draws each character in place, so the uneven inking of
# a real typewriter (each letter a little off its line) can't be done here.

font_family      family="{{ fonts.mono }}" style="Regular"
bold_font        family="{{ fonts.mono }}" style="Bold"
italic_font      family="{{ fonts.mono }}" style="Italic"
bold_italic_font family="{{ fonts.mono }}" style="Bold Italic"
font_size        {{ fonts.mono_size }}

background_opacity    {{ opacity.terminal }}
background_image      {{ derived.rice_dir }}/assets/paper-tex.png
background_image_layout tiled
background_tint       0.92
url_style             straight

# the carriage
cursor_shape          underline
cursor_underline_thickness 2.0
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_trail          0

window_padding_width  22 26

tab_bar_edge          top
tab_bar_style         separator
tab_separator         "  ┊  "
tab_bar_margin_height 4 4
active_tab_font_style   bold

# the colours, in their own file: kitty also reads it as its automatic
# light/dark theme (~/.config/kitty/{light,dark}-theme.auto.conf)
include {{ derived.build_dir }}/kitty-colors.conf
