# Generated by rice-render for {{ meta.title }}: yazi as a manila folder.
# Linked to ~/.config/yazi/theme.toml.
# The pane you're in is kraft card with dark brown writing; the chosen file
# is a translucent white highlight with bold ink. The other panes stay paper.
[mgr]
cwd               = { fg = "{{ colors.manila }}", bold = true }
hovered           = { fg = "{{ colors.ink }}", bg = "{{ colors.kraft | mix(#ffffff, 0.45) }}", bold = true }
preview_hovered   = { fg = "{{ colors.ink }}", underline = true }
find_keyword      = { fg = "{{ colors.red }}", bold = true, underline = true }
find_position     = { fg = "{{ colors.ink }}" }
marker_selected   = { fg = "{{ ansi.color2 }}", bg = "{{ ansi.color2 }}" }
marker_copied     = { fg = "{{ ansi.color3 }}", bg = "{{ ansi.color3 }}" }
marker_cut        = { fg = "{{ colors.red }}", bg = "{{ colors.red }}" }
tab_active        = { fg = "{{ colors.manila }}", bg = "{{ colors.kraft }}", bold = true }
tab_inactive      = { fg = "{{ ansi.color7 }}", bg = "{{ colors.card }}" }
border_style      = { fg = "{{ colors.kraft | darken(0.15) }}" }

[mode]
normal_main = { fg = "{{ colors.manila }}", bg = "{{ colors.kraft }}", bold = true }
normal_alt  = { fg = "{{ colors.manila }}", bg = "{{ colors.kraft | mix(colors.paper, 0.6) }}" }
select_main = { fg = "{{ colors.carbon }}", bg = "{{ colors.sticky }}", bold = true }
select_alt  = { fg = "{{ colors.carbon }}", bg = "{{ colors.paper }}" }
unset_main  = { fg = "{{ colors.card }}", bg = "{{ colors.red }}", bold = true }
unset_alt   = { fg = "{{ colors.carbon }}", bg = "{{ colors.paper }}" }

[status]
overall         = { fg = "{{ colors.manila }}", bg = "{{ colors.kraft | mix(colors.paper, 0.6) }}" }
progress_label  = { fg = "{{ colors.manila }}", bold = true }
progress_normal = { fg = "{{ colors.ink }}", bg = "{{ colors.kraft | mix(colors.paper, 0.6) }}" }
progress_error  = { fg = "{{ colors.red }}", bg = "{{ colors.kraft | mix(colors.paper, 0.6) }}" }

[filetype]
rules = [
  { mime = "image/*", fg = "{{ ansi.color6 }}" },
  { mime = "{audio,video}/*", fg = "{{ ansi.color5 }}" },
  { mime = "application/{zip,gzip,x-tar,x-7z-compressed,x-xz}", fg = "{{ colors.red }}" },
  { name = "*/", fg = "{{ colors.manila }}", bold = true },
  { name = "*", fg = "{{ colors.manila | mix(colors.carbon, 0.3) }}" },
]
