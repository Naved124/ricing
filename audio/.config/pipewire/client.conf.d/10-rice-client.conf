# Native PipeWire clients (mpv, cava, the shells) run their audio thread at normal
# priority. With rtkit, a realtime client thread gets an RLIMIT_RTTIME, and the
# kernel SIGKILLed mpv's and cava's `data-loop.0` with it again and again. The
# PipeWire daemon keeps its realtime priority, which is what keeps sound clean.
# (Shared by every rice; see CLAUDE.md, Audio.)
context.properties = {
    module.rt = false
}
