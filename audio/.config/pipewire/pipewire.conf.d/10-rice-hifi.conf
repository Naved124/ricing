# The rice's audio: the card follows the music's own rate, so a 44.1 kHz track
# reaches the DAC untouched instead of being resampled to 48 kHz. A rate the
# card can't do is skipped. (Shared by every rice; see CLAUDE.md, Audio.)
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}
