# Bluetooth at its best. PipeWire (pipewire-audio) brings LDAC, aptX, aptX HD,
# AAC, LC3 (LE Audio), Opus and SBC-XQ; LHDC v5 comes from the AUR (install
# --fresh offers it). bluez5.codecs is left unset, so every codec that's
# installed is offered and the headphones get the best they share.
monitor.bluez.properties = {
    bluez5.enable-sbc-xq    = true
    bluez5.enable-msbc      = true
    bluez5.enable-hw-volume = true
    bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag ]
}

monitor.bluez.rules = [
    {
        matches = [ { device.name = "~bluez_card.*" } ]
        actions = {
            update-props = {
                # adaptive: starts at 990 kbps and only steps down when the
                # link can't carry it, rather than stuttering at a fixed rate
                bluez5.a2dp.ldac.quality    = "auto"
                # AAC at its highest variable bitrate
                bluez5.a2dp.aac.bitratemode = 5
            }
        }
    }
]

wireplumber.settings = {
    # an app opening a mic doesn't drop the music to the call profile (mono,
    # phone quality); pick the headset profile by hand for a call
    bluetooth.autoswitch-to-headset-profile = false
}
