# Wired outputs (the headphone jack, USB DACs): never suspended when idle, so
# sound starting doesn't click or pop, and the best resampler when the card
# can't take a stream's rate.
monitor.alsa.rules = [
    {
        matches = [ { node.name = "~alsa_output.*" } ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
                resample.quality                = 10
            }
        }
    }
]
