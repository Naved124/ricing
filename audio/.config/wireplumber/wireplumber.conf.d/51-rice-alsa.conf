# Wired outputs (the headphone jack, USB DACs): never suspended when idle, so
# sound starting doesn't click or pop. The resampler stays at PipeWire's own
# quality: a higher one builds its filters in the realtime audio thread, and
# rtkit's limit on that thread had the kernel kill mpv (see CLAUDE.md, Audio).
monitor.alsa.rules = [
    {
        matches = [ { node.name = "~alsa_output.*" } ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }
]
