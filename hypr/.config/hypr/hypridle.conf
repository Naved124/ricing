# Idle, depending on power:
#   plugged in   dim at 4:30, lock at 5 min, screen off at 8, sleep at 10
#   on battery   dim at 2:30, lock at 3 min, screen off at 4, sleep at 5
# Each listener checks the power source when its time comes (`rice on-battery`
# exits 0 on battery) and re-checks every 30 s while you stay idle, so
# unplugging mid-idle moves you onto the battery timings.
# Caffeine in the control centre (or any app inhibiting idle, like a video)
# holds all of this off.
# `rice lock` uses the active rice's lock screen (Quickshell or hyprlock).

general {
    lock_cmd         = rice lock
    before_sleep_cmd = loginctl lock-session
    # and auto mode catches up: the sun may have set while it slept
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; rice mode tick
    inhibit_sleep    = 3
}

# ── plugged in ──────────────────────────────────────────────────────────
listener {
    timeout         = 270
    condition_cmd   = ! rice on-battery
    condition_retry = 30
    on-timeout      = brightnessctl -s set 30%
    on-resume       = brightnessctl -r
}

listener {
    timeout         = 300
    condition_cmd   = ! rice on-battery
    condition_retry = 30
    on-timeout      = loginctl lock-session
}

listener {
    timeout         = 480
    condition_cmd   = ! rice on-battery
    condition_retry = 30
    on-timeout      = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume       = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout         = 600
    condition_cmd   = ! rice on-battery
    condition_retry = 30
    on-timeout      = systemctl suspend
}

# ── on battery ──────────────────────────────────────────────────────────
listener {
    timeout         = 150
    condition_cmd   = rice on-battery
    condition_retry = 30
    on-timeout      = brightnessctl -s set 30%
    on-resume       = brightnessctl -r
}

listener {
    timeout         = 180
    condition_cmd   = rice on-battery
    condition_retry = 30
    on-timeout      = loginctl lock-session
}

listener {
    timeout         = 240
    condition_cmd   = rice on-battery
    condition_retry = 30
    on-timeout      = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume       = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout         = 300
    condition_cmd   = rice on-battery
    condition_retry = 30
    on-timeout      = systemctl suspend
}
