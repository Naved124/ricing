# Rice switcher: source this from the base hyprland.conf.
#   source = ~/.config/hypr/rice.conf

# The visual layer of the active rice (borders, rounding, blur, animations).
source = ~/.config/rices/current/hypr.conf

# the auto-mode timer runs `rice` from systemd, which needs these
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = ags run ~/.config/ags/rice

bind = SUPER, T, exec, rice choose
bind = SUPER SHIFT, T, exec, rice next

# chooser: blur what's behind it
layerrule = blur, rice-chooser
layerrule = ignorezero, rice-chooser
# overlay must appear and disappear instantly; the dissolve is drawn by AGS
layerrule = noanim, rice-freeze
layerrule = noanim, rice-chooser
