# Golden Gate's optional keyd remap: ⌘C/V/X/A/Z/F/T/S send the Ctrl versions
# in apps, as on the Mac, and a tap of Super opens Spotlight. NOT installed: it is system-wide (every rice, every
# session), so it waits for the user's yes. To use it:
#   sudo pacman -S keyd
#   sudo install -Dm644 docs/goldengate/keyd-goldengate.conf /etc/keyd/goldengate.conf
#   sudo systemctl enable --now keyd
# Undo: sudo rm /etc/keyd/goldengate.conf && sudo systemctl disable --now keyd

[ids]
*

[main]
# Super on its own sends Super+Space (Spotlight, the shared launcher bind);
# held, it is ⌘ for the keys below
leftmeta = overload(meta_mac, M-space)

[meta_mac:M]
c = C-c
v = C-v
x = C-x
a = C-a
z = C-z
f = C-f
t = C-t
s = C-s

# ⌃⌘ is the window manager's (⌃⌘F full screen, ⌃⌘C centre, ⌃⌘arrows): with
# Control held too, the keys go through as they are
[meta_mac+control]
c = C-M-c
v = C-M-v
x = C-M-x
a = C-M-a
z = C-M-z
f = C-M-f
t = C-M-t
s = C-M-s

# ⌘⇧C/F/S/T are the shared binds (colour picker, float, scratchpad, the rice
# chooser): they go through too. ⌘⇧Z, ⌘⇧V, ⌘⇧X, ⌘⇧A stay the apps' (redo …)
[meta_mac+shift]
c = S-M-c
f = S-M-f
s = S-M-s
t = S-M-t
