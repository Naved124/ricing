# The colours are two flavours, one per mode (rice-light.yazi and rice-dark.yazi
# in ~/.config/yazi/flavors). yazi picks one by the terminal's background when
# it starts, so after `rice mode` new yazi windows come up in the new mode.
[flavor]
light = "rice-light"
dark  = "rice-dark"
