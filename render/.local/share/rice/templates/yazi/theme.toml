# Generated by rice-render for {{ meta.title }}. Linked to ~/.config/yazi/theme.toml.
# Keys follow yazi 25.5+ ([indicator], [tabs], `url` in filetype rules).
[mgr]
cwd               = { fg = "{{ roles.accent | darken(0.3) }}" }
find_keyword      = { fg = "{{ ansi.color3 }}", bold = true }
find_position     = { fg = "{{ ansi.color5 }}" }
marker_selected   = { fg = "{{ roles.success }}", bg = "{{ roles.success }}" }
marker_copied     = { fg = "{{ roles.warning }}", bg = "{{ roles.warning }}" }
marker_cut        = { fg = "{{ roles.urgent }}", bg = "{{ roles.urgent }}" }
border_style      = { fg = "{{ roles.border }}" }

[indicator]
current = { fg = "{{ roles.fg }}", bg = "{{ roles.selection }}", bold = true }
preview = { underline = true }

[tabs]
active   = { fg = "{{ roles.accent | readable }}", bg = "{{ roles.accent }}" }
inactive = { fg = "{{ roles.muted }}", bg = "{{ roles.surface }}" }

[mode]
normal_main = { fg = "{{ gradient.stops | last | readable }}", bg = "{{ gradient.stops | last }}", bold = true }
normal_alt  = { fg = "{{ roles.fg }}", bg = "{{ roles.surface }}" }
select_main = { fg = "{{ gradient.stops | first | readable }}", bg = "{{ gradient.stops | first }}", bold = true }
select_alt  = { fg = "{{ roles.fg }}", bg = "{{ roles.surface }}" }
unset_main  = { fg = "{{ roles.warning | readable }}", bg = "{{ roles.warning }}", bold = true }
unset_alt   = { fg = "{{ roles.fg }}", bg = "{{ roles.surface }}" }

[status]
progress_label  = { fg = "{{ roles.fg }}", bold = true }
progress_normal = { fg = "{{ roles.accent }}", bg = "{{ roles.surface }}" }
progress_error  = { fg = "{{ roles.urgent }}", bg = "{{ roles.surface }}" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "{{ ansi.color6 }}" },
  { mime = "**/{audio,video}/*", fg = "{{ ansi.color5 }}" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma}", fg = "{{ ansi.color1 }}" },
  { url = "*/", fg = "{{ ansi.color4 }}" },
  { url = "*", fg = "{{ roles.fg }}" },
]
