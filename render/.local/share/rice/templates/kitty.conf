# Generated by rice-render for {{ meta.title }}. Include it from kitty.conf:
#   include ~/.local/share/rice/active/kitty.conf
# kitty re-reads it on SIGUSR1, which `rice` sends on every switch.

font_family      family="{{ fonts.mono }}" style="{{ fonts.weight | weightname }}"
bold_font        family="{{ fonts.mono }}" style="{{ fonts.weight_strong | weightname }}"
italic_font      family="{{ fonts.mono }}" style="{{ fonts.weight | weightname }} Italic"
bold_italic_font family="{{ fonts.mono }}" style="{{ fonts.weight_strong | weightname }} Italic"
font_size        {{ fonts.mono_size }}

background_opacity    {{ opacity.terminal }}

cursor_shape          beam
cursor_beam_thickness 2
cursor_trail          3
cursor_trail_decay    0.08 0.3

window_padding_width  18

tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
active_tab_font_style   bold

# the colours, in their own file: kitty also reads it as its automatic
# light/dark theme (~/.config/kitty/{light,dark}-theme.auto.conf)
include {{ derived.build_dir }}/kitty-colors.conf
