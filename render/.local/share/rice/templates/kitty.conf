# Generated by rice-render for {{ meta.title }}. Include it from kitty.conf:
#   include ~/.config/rices/current/build/kitty.conf
# kitty re-reads it on SIGUSR1, which `rice` sends on every switch.

font_family      {{ fonts.mono }}
font_size        {{ fonts.mono_size }}

background            {{ roles.term_bg }}
background_opacity    {{ opacity.terminal }}
foreground            {{ roles.term_fg }}
selection_background  {{ roles.selection }}
selection_foreground  {{ roles.fg }}
url_color             {{ ansi.color4 }}

cursor                {{ roles.cursor }}
cursor_text_color     {{ roles.bg }}
cursor_shape          beam
cursor_beam_thickness 2
cursor_trail          3
cursor_trail_decay    0.08 0.3

window_padding_width  18
active_border_color   {{ roles.accent }}
inactive_border_color {{ roles.border }}

tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_background    {{ roles.term_bg }}
active_tab_background   {{ roles.accent }}
active_tab_foreground   {{ roles.fg }}
active_tab_font_style   bold
inactive_tab_background {{ roles.surface }}
inactive_tab_foreground {{ roles.muted }}

