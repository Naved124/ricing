sidebar            = {{ dark.roles.bg | mix(roles.surface, 0.5) | nohash }}
player             = {{ dark.roles.bg | nohash }}
card               = {{ dark.roles.surface | nohash }}
shadow             = {{ dark.roles.shadow | nohash }}
selected-row       = {{ dark.roles.fg | nohash }}
button             = {{ dark.roles.accent | darken(0.3) | nohash }}
button-active      = {{ dark.roles.accent | darken(0.4) | nohash }}
button-disabled    = {{ dark.roles.border | nohash }}
tab-active         = {{ dark.roles.selection | nohash }}
notification       = {{ dark.roles.selection | nohash }}
notification-error = {{ dark.roles.urgent | nohash }}
misc               = {{ dark.roles.border | nohash }}
