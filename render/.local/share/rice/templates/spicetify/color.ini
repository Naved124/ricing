; Generated by rice-render for {{ meta.title }}: linked to ~/.config/spicetify/Themes/Rice.
; One scheme per mode; `rice mode` picks it:
;   spicetify config current_theme Rice color_scheme rice-light && spicetify apply
[rice-light]
