subtext            = {{ light.roles.muted | nohash }}
main               = {{ light.roles.bg | nohash }}
main-elevated      = {{ light.roles.surface | nohash }}
highlight          = {{ light.roles.surface | nohash }}
highlight-elevated = {{ light.roles.overlay | nohash }}
sidebar            = {{ light.roles.bg | mix(roles.surface, 0.5) | nohash }}
player             = {{ light.roles.bg | nohash }}
card               = {{ light.roles.surface | nohash }}
shadow             = {{ light.roles.shadow | nohash }}
selected-row       = {{ light.roles.fg | nohash }}
button             = {{ light.roles.accent | darken(0.3) | nohash }}
button-active      = {{ light.roles.accent | darken(0.4) | nohash }}
button-disabled    = {{ light.roles.border | nohash }}
tab-active         = {{ light.roles.selection | nohash }}
notification       = {{ light.roles.selection | nohash }}
notification-error = {{ light.roles.urgent | nohash }}
misc               = {{ light.roles.border | nohash }}
[rice-dark]
text               = {{ dark.roles.fg | nohash }}
subtext            = {{ dark.roles.muted | nohash }}
main               = {{ dark.roles.bg | nohash }}
main-elevated      = {{ dark.roles.surface | nohash }}
highlight          = {{ dark.roles.surface | nohash }}
