player             = {{ roles.bg | nohash }}
card               = {{ roles.surface | nohash }}
shadow             = {{ roles.shadow | nohash }}
selected-row       = {{ roles.fg | nohash }}
button             = {{ roles.accent | darken(0.3) | nohash }}
button-active      = {{ roles.accent | darken(0.4) | nohash }}
button-disabled    = {{ roles.border | nohash }}
tab-active         = {{ roles.selection | nohash }}
notification       = {{ roles.selection | nohash }}
