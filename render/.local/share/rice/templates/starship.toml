# Generated by rice-render for {{ meta.title }}. Linked to ~/.config/starship.toml.
# For the transient prompt (old prompts collapse to ❯), add to your shell rc:
#   zsh:  see the README "Shell" section;  fish: enable_transience
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"
palette = "rice"

[palettes.rice]
path   = "{{ roles.accent | darken(0.25) }}"
branch = "{{ roles.link | darken(0.35) }}"
prompt = "{{ roles.urgent | darken(0.2) }}"
muted  = "{{ roles.muted }}"
error  = "{{ ansi.color1 }}"

[directory]
style = "bold path"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style  = "branch"
format = "[$symbol$branch]($style) "

[git_status]
style  = "muted"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2000
style    = "muted"
format   = "[$duration]($style) "

[character]
success_symbol = "[❯](bold prompt)"
error_symbol   = "[❯](bold error)"
