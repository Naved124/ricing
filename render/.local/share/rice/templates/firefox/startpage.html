<!doctype html>
<!-- Generated by rice-render for {{ meta.title }}. Set it as Firefox's home page:
       file://{{ derived.build_dir }}/firefox/startpage.html
     or, to follow rice switches, the same path through ~/.config/rices/current/build/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<style>
:root {
    --bg: {{ roles.bg }};
    --surface: {{ roles.surface }};
    --border: {{ roles.border }};
    --fg: {{ roles.fg }};
    --muted: {{ roles.muted }};
    --accent: {{ roles.accent }};
    --wash: linear-gradient(90deg, {{ roles.urgent | rgba(0.6) }}, {{ roles.selection | rgba(0.6) }});
    --gradient: conic-gradient(from 0deg, {{ gradient.stops | closed | join(", ") }});
}
* { box-sizing: border-box; }
html, body { min-height: 100vh; margin: 0; }
body {
    background:
        radial-gradient(60vmax 60vmax at 15% 20%, {{ gradient.stops.0 | rgba(0.35) }}, transparent 60%),
        radial-gradient(50vmax 50vmax at 85% 30%, {{ gradient.stops.1 | rgba(0.35) }}, transparent 60%),
        radial-gradient(55vmax 55vmax at 50% 95%, {{ gradient.stops | last | rgba(0.3) }}, transparent 60%),
        var(--bg);
    background-attachment: fixed;
    color: var(--fg);
    font-family: "{{ fonts.ui }}", system-ui, sans-serif;
    display: grid;
    place-items: center;
}
main { width: min(640px, 100% - 32px); text-align: center; }
h1 {
    font-family: "{{ fonts.display }}", serif;
    font-weight: 400;
    font-size: clamp(40px, 7vw, 64px);
    margin: 0;
}
.date {
    font-variant: small-caps;
    letter-spacing: .12em;
    color: var(--muted);
    margin: 6px 0 32px;
}
form { position: relative; }
input {
    width: 100%;
    height: 52px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 70%, transparent);
    backdrop-filter: blur(12px);
    color: var(--fg);
    font: inherit;
    font-size: 17px;
    padding: 0 24px;
    outline: none;
    caret-color: {{ roles.accent | darken(0.25) }};
    transition: box-shadow .35s cubic-bezier({{ motion.bloom | join(", ") }});
}
input:focus { box-shadow: 0 0 0 3px {{ roles.accent | rgba(0.5) }}; }
input::placeholder { color: var(--muted); }
nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px;
    margin-top: 36px;
}
nav a {
    display: grid;
    justify-items: center;
    gap: 8px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
}
.pearl {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 18px;
    font-weight: 600;
    color: var(--fg);
    background: radial-gradient(circle at 35% 30%, #fff, var(--bg) 45%, var(--surface));
    box-shadow: 0 6px 18px {{ roles.shadow | rgba(0.2) }}, inset 0 0 0 1px var(--border);
    transition: transform .3s cubic-bezier({{ motion.settle | join(", ") }});
    position: relative;
}
.pearl::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: var(--gradient);
    opacity: 0;
    z-index: -1;
    transition: opacity .3s;
}
nav a:hover .pearl, nav a:focus-visible .pearl { transform: scale(1.08); }
nav a:hover .pearl::before, nav a:focus-visible .pearl::before { opacity: 1; }
nav a:hover { color: var(--fg); }
</style>
</head>
<body>
<main>
    <h1 id="greeting">Hello</h1>
    <div class="date" id="date"></div>
    <form action="https://duckduckgo.com/" method="get" autocomplete="off">
        <input name="q" placeholder="Search, or type an address" autofocus aria-label="Search">
    </form>
    <!-- your places: edit the template (render/.local/share/rice/templates/firefox/startpage.html) -->
    <nav>
        <a href="https://github.com"><span class="pearl">G</span>GitHub</a>
        <a href="https://www.youtube.com"><span class="pearl">Y</span>YouTube</a>
        <a href="https://mail.google.com"><span class="pearl">M</span>Mail</a>
        <a href="https://www.reddit.com/r/unixporn"><span class="pearl">r/</span>unixporn</a>
        <a href="https://wiki.hypr.land"><span class="pearl">H</span>Hyprland</a>
    </nav>
</main>
<script>
const now = new Date(), h = now.getHours();
document.getElementById("greeting").textContent =
    h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
document.getElementById("date").textContent =
    now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
// a typed address goes straight there
document.querySelector("form").addEventListener("submit", e => {
    const q = e.target.q.value.trim();
    if (/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q)) {
        e.preventDefault();
        location.href = q.includes("://") ? q : "https://" + q;
    }
});
</script>
</body>
</html>
