# Generated by rice-render for {{ meta.title }}: ReGreet's settings.
# Installed to /etc/greetd/regreet.toml by system/greetd/install (needs sudo).

[background]
# the wallpaper's still frame, copied here by the installer
path = "/etc/greetd/background.png"
fit = "Cover"

[GTK]
application_prefer_dark_theme = {{ derived.is_dark | bool }}
font_name = "{{ fonts.ui }} {{ fonts.ui_size }}"
cursor_theme_name = "{{ gtk.cursor }}"
icon_theme_name = "{{ gtk.icons }}"
theme_name = "{{ gtk.theme }}"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[appearance]
greeting_msg = "Welcome back"

[widget.clock]
format = "%H:%M"
resolution = "500ms"
