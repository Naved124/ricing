<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Golden Gate's fonts are Apple's (AUR otf-apple-sf-pro, -sf-mono, -ny). When
     they're missing, a request for them gets the nearest open font instead of
     fontconfig's default: Inter for SF Pro, Inter Display for SF Pro Display,
     JetBrains Mono for SF Mono, and a serif for New York. Weak bindings only add
     these after the Apple fonts, so with those installed nothing changes. -->
<fontconfig>
  <alias binding="weak"><family>SF Pro</family><accept><family>Inter</family></accept></alias>
  <alias binding="weak"><family>SF Pro Text</family><accept><family>Inter</family></accept></alias>
  <alias binding="weak"><family>SF Pro Display</family><accept><family>Inter Display</family><family>Inter</family></accept></alias>
  <alias binding="weak"><family>SF Pro Rounded</family><accept><family>Inter</family></accept></alias>
  <alias binding="weak"><family>SF Mono</family><accept><family>JetBrains Mono</family></accept></alias>
  <alias binding="weak"><family>New York</family><accept><family>Newsreader</family><family>serif</family></accept></alias>
</fontconfig>
