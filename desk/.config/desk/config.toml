# Desk: the Notion page desk-sync mirrors into every rice's bar.
# IDs only; the integration's credential lives in the keyring, never here
# (secret-tool store --label="Desk Notion" service desk-notion).

[notion]
api = "https://api.notion.com/v1"
# Checked against Notion's SDK (makenotion/notion-sdk-js): 2026-03-11 is the
# version that renamed `archived` to `in_trash`; data sources are queried at
# /data_sources/{id}/query and new pages take a data_source_id parent.
version = "2026-03-11"
requests_per_second = 3
timeout_seconds = 10
max_retries = 4

[desk]
page = "408f77e42ad781838d0fef148f38e6f9"
brief = "408f77e42ad7811e9e80f9ab65d5ea49"

# data source (collection) IDs
[sources]
today = "1dfb4083-c9f8-4999-a1ff-7b9544a41f1d"
jobs = "18c68b50-45bc-4173-9cb4-b469aa3f6ac0"
countdowns = "a0f711f7-e11d-42bd-b536-6fbdbe4e1790"
ideas = "fe4d63e3-abb2-46c3-b92f-1d7b1c31bf1d"

# property names, as they are in Notion
[fields.today]
title = "Task"
done = "Done"
due = "Due"
area = "Area"
priority = "Priority"
notes = "Notes"

[fields.jobs]
title = "Role"
company = "Company"
status = "Status"
track = "Track"
applied = "Applied on"
referral = "Referral"
location = "Location"
link = "Link"
next = "Next step"

[fields.countdowns]
title = "Event"
date = "Date"
type = "Type"
days_left = "Days left"
prep = "Prep note"
done = "Done"

[fields.ideas]
title = "Idea"

[sync]
# how many pages of 100 rows to read from each source, at most
max_pages = 5
# the panel calls a sync older than this stale
stale_minutes = 15
capture_max = 200
priority_default = "Normal"
